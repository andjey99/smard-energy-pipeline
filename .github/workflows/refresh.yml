name: Daten aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"   # täglich 05:17 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pipeline ausführen
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Kein Secret DATABASE_URL gesetzt, nutze lokale SQLite-Datei."
            export DATABASE_URL="sqlite:///energie.db"
          fi
          python -m pipeline.main --weeks 4 --export data
      - name: CSV-Dateien bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: energiedaten-csv
          path: data/
          retention-days: 14
