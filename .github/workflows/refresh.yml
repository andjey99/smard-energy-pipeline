name: Daten aktualisieren

on:
  schedule:
    - cron: "17 5 * * *"   # täglich 05:17 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pipeline ausführen (nur wenn eine Cloud-Datenbank hinterlegt ist)
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Kein Secret DATABASE_URL gesetzt, überspringe."
            exit 0
          fi
          python -m pipeline.main --weeks 2
